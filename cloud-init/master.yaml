#cloud-config
hostname: ${hostname}
fqdn: ${hostname}.${domain}

chpasswd:
  list: |
    root:${master_root_password}
  expire: False
ssh_pwauth: false

users:
  - name: ${ssh_user}
    groups: [wheel]
    shell: /bin/bash
    ssh_authorized_keys:
      - ${ssh_public_key}
    sudo: ALL=(ALL) NOPASSWD:ALL

write_files:
  - path: /etc/profile.d/hostname-prompt.sh
    content: |
      if [ -n "$BASH_VERSION" ]; then
        PS1='[\u@\H \W]\n> '
      fi
