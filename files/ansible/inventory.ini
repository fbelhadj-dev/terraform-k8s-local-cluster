[control_plane]
control-plane ansible_host=master.${domain} ansible_user=master ansible_ssh_private_key_file=${ssh_private_key_path}/master


[workers]
%{ for worker in workers ~}
${worker} ansible_host=${worker}.${domain}
%{ endfor }

[workers:vars]
ansible_user=worker
ansible_ssh_private_key_file=${ssh_private_key_path}/{{ inventory_hostname }}

[k8s_cluster:children]
control_plane
workers

[k8s_cluster:vars]
ansible_become=true

[all:vars]
ansible_ssh_common_args='-o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=~/.ssh/known_hosts'
