apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute

metadata:
  name: forgejo
  namespace: scm
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway
      namespace: traefik
      sectionName: web
  hostnames:
    - forgejo.${domain}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - kind: Service
          name: forgejo-http
          port: 3000
